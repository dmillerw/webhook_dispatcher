version: '3.8'

# Development setup with hot-reload
services:
  webhook-dispatch:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: webhook-dispatch-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"
      - "2345:2345"  # Delve debugger port
    volumes:
      # Mount source code for hot-reload
      - .:/app
      # Exclude vendor and build artifacts
      - /app/vendor
      - /app/.git
    environment:
      - TZ=UTC
      - ENV=development
      - LOG_LEVEL=debug
    command: ["air", "-c", ".air.toml"]
    networks:
      - dev-network

  # Mock HTTP server for testing destinations
  mock-server:
    image: mockserver/mockserver:latest
    container_name: webhook-mock
    restart: unless-stopped
    ports:
      - "1080:1080"
    environment:
      - MOCKSERVER_PROPERTY_FILE=/config/mockserver.properties
      - MOCKSERVER_INITIALIZATION_JSON_PATH=/config/initializerJson.json
    volumes:
      - ./test/mock-server:/config:ro
    networks:
      - dev-network

  # Webhook testing tool
  webhook-tester:
    image: tarampampam/webhook-tester:latest
    container_name: webhook-tester
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge
